<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photo Show</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

<style>

:root {
    --mycolor: lavenderblush;
}

.mystyle{
    background: var(--mycolor);
}

.photo-size{
    width: 100%;
    height: 450px;
    object-fit: cover;
}

</style>

  <body>
    <div class="container-fluid shadow-lg text-uppercase text-center mystyle p-4 mb-5">
        <h1 class="text-primary-emphasis">Photo Show</h1>
        <p>Welcome to my photo gallery</p>
    </div>

<!-- Photo Gallery -->

<div>
    <div class="row">

        <div class="p-4 col-sm-12 col-md-6 col-lg-4">
            <img src="Images/n1.jpg" alt="Pic" class="img-thumbnail img-fluid photo-size">
        </div>

        <div class="p-4 col-sm-12 col-md-6 col-lg-4">
            <img src="Images/n2.jpg" alt="Pic" class="img-thumbnail img-fluid photo-size">
        </div>

        <div class="p-4 col-sm-12 col-md-6 col-lg-4">
            <img src="Images/n3.jpg" alt="Pic" class="img-thumbnail img-fluid photo-size">
        </div>

        <div class="p-4 col-sm-12 col-md-6 col-lg-4">
            <img src="Images/n4.jpg" alt="Pic" class="img-thumbnail img-fluid photo-size">
        </div>

        <div class="p-4 col-sm-12 col-md-6 col-lg-4">
            <img src="Images/n5.jpg" alt="Pic" class="img-thumbnail img-fluid photo-size">
        </div>

        <div class="p-4 col-sm-12 col-md-6 col-lg-4">
            <img src="Images/n6.jpg" alt="Pic" class="img-thumbnail img-fluid photo-size">
        </div>

    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<footer>
    <div class="container-fluid text-center mystyle p-3 mt-4 shadow-lg">
        <p class="mb-0">
            My Bootstrap Photo Show
        </p>
    </div>
</footer>

  </body>
</html>
